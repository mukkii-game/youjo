<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ょぅι゛ょ期の終わり</title>
<style>
@font-face{font-family:Book;src:url(data:font/woff;base64,__FONT__) format('woff');font-display:swap}
:root{color-scheme:light;--paper:#fff9e9;--ink:#182c40;--size:1.375rem}
*{box-sizing:border-box}html{background:#142538}body{margin:0;color:var(--ink);font-family:Book,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;line-height:1.85}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible,select:focus-visible{outline:3px solid #cf572f;outline-offset:4px}button:disabled{opacity:.35;cursor:default}
#reader{min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding:32px 24px 100px}article{width:min(1320px,100%);margin:auto;display:grid;grid-template-columns:minmax(0,1.45fr) minmax(340px,1fr);background:var(--paper);box-shadow:0 20px 65px #0005;min-height:610px}
figure{margin:0;background:#152337;display:flex;align-items:center;overflow:hidden}figure img{width:100%;height:auto;display:block}.copy{padding:38px clamp(24px,3vw,46px);display:flex;flex-direction:column;justify-content:center;position:relative}.text{font-size:var(--size);line-height:1.9;line-break:strict;overflow-wrap:anywhere}.text p{margin:0 0 .65em}.text p:last-child{margin-bottom:0}ruby{ruby-align:center}.dakuten{display:inline-block;width:.23em}rt{font-size:.48em;line-height:1.1}h1{font-weight:400;font-size:clamp(2.15rem,3.9vw,3.6rem);line-height:1.65;letter-spacing:.02em;margin:0 0 28px}.title-top{white-space:nowrap}.sub{font-size:1rem;letter-spacing:.14em}.cover .copy:before{content:'';display:block;width:40px;height:4px;background:#cc5a34;margin-bottom:30px}.folio{font-size:14px;letter-spacing:.16em;color:#64707a;position:absolute;bottom:12px;right:24px}
nav{position:fixed;bottom:0;left:0;right:0;min-height:72px;background:#142538f5;color:#fff9e9;display:flex;align-items:center;justify-content:center;gap:18px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:2;backdrop-filter:blur(8px)}nav button{background:transparent;border:1px solid #b6bec46b;color:inherit;border-radius:4px;padding:6px 17px;min-height:46px;font-size:16px}#next{background:#f4dfad;color:#142538;border-color:#f4dfad}select{font:inherit;font-size:16px;background:#142538;color:#fff9e9;border:0;max-width:100px;padding:8px}#larger{font-size:14px;padding:5px 11px}#print-pages{display:none}.endmark{font-size:15px;letter-spacing:.3em;margin-top:22px;color:#9c492e}
@media(min-width:1500px){:root{--size:1.65rem}}
@media(max-width:800px){#reader{padding:0 0 94px;justify-content:flex-start}article{display:block;min-height:0;box-shadow:none}figure img{aspect-ratio:3/2;object-fit:contain}.copy{min-height:340px;padding:25px 25px 44px}.text{line-height:1.9}h1{font-size:2.65rem;line-height:1.6;margin-bottom:14px}.cover .copy{min-height:330px}.cover .copy:before{margin-bottom:15px}nav{gap:9px;padding-left:10px;padding-right:10px}nav button{padding:6px 12px}#larger{padding:5px 7px;font-size:13px}.folio{bottom:10px}}
@media(prefers-reduced-motion:no-preference){.copy{animation:appear .22s ease-out}@keyframes appear{from{opacity:.6}to{opacity:1}}}
@page{size:480pt 800pt;margin:0}
@media print{html,body{background:var(--paper)}#reader,nav{display:none!important}#print-pages{display:block}.print-page{width:480pt;height:800pt;page-break-after:always;break-after:page;position:relative;background:var(--paper);overflow:hidden}.print-page:last-child{page-break-after:auto}.print-page figure{height:320pt;display:block}.print-page img{width:480pt;height:320pt;object-fit:contain}.print-page .copy{display:flex;padding:25pt 29pt 33pt;height:480pt;justify-content:center}.print-page .text{font-size:20pt;line-height:1.8}.print-page .text p{margin-bottom:.45em}.print-page h1{font-size:38pt;line-height:1.7}.print-page .folio{font-size:11pt;bottom:14pt;right:24pt}.print-page .sub{font-size:16pt}.print-page .endmark{font-size:12pt;margin-top:14pt}}
</style></head><body>
<main id="reader" aria-label="えほん"></main>
<nav aria-label="ページをめくる"><button id="prev" type="button">もどる</button><label><select id="page" aria-label="ページ"></select></label><button id="next" type="button">つぎへ</button><button id="larger" type="button" aria-pressed="false">もじ 大</button></nav>
<div id="print-pages"></div>
<script>
const pages=__PAGES__;
const images=__IMAGES__;
const reader=document.querySelector('#reader'), select=document.querySelector('#page');
let index=0,large=false;
const descriptions=['ぎんいろの大きなうちゅうせんと、みおたちのまち。','みおが、つのとはねのあるカレルさんに紙の花をあげる。','子どもたちのゆめをつなぐ、ほしのひかり。','うちゅうせんから、ほしの海を見上げるみおとカレルさん。','みおのはなしを、しずかにきくおとうさん。','みおのてがみと、すきまをのこしてつながるほしたち。','いつものまちで、てがみをわたす子どもたち。','大きくなったみおが、うちゅうせんへむかい、ふりかえる。'];
function content(p,print=false){return `<figure><img src="${images[p.image]}" alt="${descriptions[p.image]}"></figure><div class="copy">${p.n===0?'<h1><span class="title-top">ょぅι<span class="dakuten">゛</span>ょ<ruby>期<rt>き</rt></ruby>の</span><br><ruby>終わり<rt>おわり</rt></ruby></h1><p class="sub">ほしと てがみの ものがたり</p>':`<div class="text">${p.html}</div>`}${p.n===23?'<div class="endmark">おしまい</div>':''}<span class="folio">${p.n===0?'':String(p.n).padStart(2,'0')}</span></div>`}
function show(n){index=Math.max(0,Math.min(23,n));reader.innerHTML=`<article class="${index===0?'cover':''}" aria-label="${index===0?'ひょうし':index+'ページ'}">${content(pages[index])}</article>`;select.value=index;document.querySelector('#prev').disabled=index===0;document.querySelector('#next').textContent=index===23?'はじめから':'つぎへ';try{history.replaceState(null,'','#p'+index)}catch{};window.scrollTo({top:0,behavior:'instant'})}
select.innerHTML=pages.map(p=>`<option value="${p.n}">${p.n===0?'ひょうし':p.n+' / 23'}</option>`).join('');
document.querySelector('#prev').onclick=()=>show(index-1);document.querySelector('#next').onclick=()=>show(index===23?0:index+1);select.onchange=()=>show(+select.value);
document.querySelector('#larger').onclick=function(){large=!large;document.documentElement.style.setProperty('--size',large?'1.75rem':'1.375rem');this.textContent=large?'もじ 小':'もじ 大';this.setAttribute('aria-pressed',large)};
document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;if(e.key==='ArrowRight'){e.preventDefault();show(index+1)}if(e.key==='ArrowLeft'){e.preventDefault();show(index-1)}});
let touch=null;reader.addEventListener('touchstart',e=>{if(e.touches.length===1)touch={x:e.touches[0].clientX,y:e.touches[0].clientY};else touch=null},{passive:true});reader.addEventListener('touchend',e=>{if(!touch)return;const dx=e.changedTouches[0].clientX-touch.x,dy=e.changedTouches[0].clientY-touch.y;if(Math.abs(dx)>75&&Math.abs(dx)>Math.abs(dy)*1.8)show(index+(dx<0?1:-1));touch=null},{passive:true});
window.preparePrint=()=>{document.querySelector('#print-pages').innerHTML=pages.map(p=>`<section class="print-page ${p.n===0?'cover':''}">${content(p,true)}</section>`).join('')};window.addEventListener('beforeprint',preparePrint);
const m=location.hash.match(/^#p(\d+)$/);show(m?+m[1]:0);
</script></body></html>
